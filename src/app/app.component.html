<!-- Trang đăng nhập, đăng ký, quên mật khẩu - không có sidebar/header -->
<div *ngIf="isLoginPage" class="auth-layout">
  <router-outlet></router-outlet>
</div>

<!-- Customer Shop Website - không có sidebar/header -->
<div *ngIf="isShopPage" class="shop-layout">
  <router-outlet></router-outlet>
</div>

<!-- Admin/Staff Layout - có sidebar và header -->
<div *ngIf="showAdminLayout" class="app-container" [class.sidebar-hidden]="sidebarHidden">
  <app-sidebar [isCollapsed]="sidebarHidden"></app-sidebar>
  <div class="main-content">
    <app-header (menuToggle)="toggleSidebar()"></app-header>
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
