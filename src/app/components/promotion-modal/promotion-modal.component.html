<div class="modal-overlay" *ngIf="isVisible" (click)="onBackdropClick($event)">
  <div class="modal-container" [class.edit-mode]="isEditMode">
    <button class="close-btn" (click)="onClose()">
      <i class="bi bi-x"></i>
    </button>

    <div class="modal-body">
      <div class="modal-content-layout">
        <!-- Left Panel: Thông Tin Đợt Giảm Giá -->
        <div class="left-panel">
          <div class="panel-header">
            <i class="bi bi-info-circle"></i>
            <h4>Thông Tin Đợt Giảm Giá</h4>
          </div>

          <form (ngSubmit)="onSave()">
            <div class="form-group">
              <label for="code">Mã đợt giảm giá</label>
              <input type="text" id="code" class="form-control" [(ngModel)]="formData.code" name="code"
                placeholder="Mã tự động" [readonly]="true" required />
            </div>

            <div class="form-group">
              <label for="name">Tên đợt giảm giá</label>
              <input type="text" id="name" class="form-control" [(ngModel)]="formData.name" name="name"
                placeholder="Nhập tên đợt giảm giá" [readonly]="isViewMode" required />
            </div>

            <div class="form-group">
              <label for="discountType">Loại giảm giá</label>
              <select id="discountType" class="form-control" [(ngModel)]="formData.discountType" name="discountType"
                [disabled]="isViewMode" required>
                <option value="">Chọn loại giảm giá</option>
                <option value="PHAN_TRAM">Phần trăm (%)</option>
                <option value="SO_TIEN">Số tiền (VND)</option>
              </select>
            </div>

            <!-- Hiển thị khi chọn Phần trăm -->
            <div class="form-group" *ngIf="formData.discountType === 'PHAN_TRAM'">
              <label for="discountValue">Giá trị giảm giá (%)</label>
              <input type="number" id="discountValue" class="form-control" [(ngModel)]="formData.discountValue"
                name="discountValue" placeholder="Nhập % giảm giá (0-100)" min="0" max="100" [readonly]="isViewMode"
                [required]="formData.discountType === 'PHAN_TRAM'" />
            </div>

            <!-- Hiển thị khi chọn Số tiền -->
            <div class="form-group" *ngIf="formData.discountType === 'SO_TIEN'">
              <label for="maxDiscountAmount">Số tiền giảm (VND)</label>
              <input type="number" id="maxDiscountAmount" class="form-control" [(ngModel)]="formData.maxDiscountAmount"
                name="maxDiscountAmount" placeholder="Nhập số tiền giảm" min="0" [readonly]="isViewMode"
                [required]="formData.discountType === 'SO_TIEN'" />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="startDate">Ngày bắt đầu</label>
                <div class="date-input-group">
                  <input type="date" id="startDate" class="form-control" [(ngModel)]="formData.startDate"
                    name="startDate" [readonly]="isViewMode" required />
                  <i class="bi bi-calendar3"></i>
                </div>
              </div>

              <div class="form-group">
                <label for="endDate">Ngày kết thúc</label>
                <div class="date-input-group">
                  <input type="date" id="endDate" class="form-control" [(ngModel)]="formData.endDate" name="endDate"
                    [readonly]="isViewMode" required />
                  <i class="bi bi-calendar3"></i>
                </div>
              </div>
            </div>

            <div class="form-actions" [ngClass]="{'edit-mode-actions': isEditMode}">
              <button type="button" class="btn btn-secondary" (click)="onClose()">
                <i class="bi bi-arrow-left"></i>
                Quay Về
              </button>
              <button type="submit" class="btn" [ngClass]="isEditMode ? 'btn-update' : 'btn-success'"
                [disabled]="isViewMode">
                <i [ngClass]="isEditMode ? 'bi bi-check-circle' : 'bi bi-plus'"></i>
                {{ isEditMode ? 'Cập Nhật' : 'Thêm' }}
              </button>
            </div>
          </form>
        </div>

        <!-- Right Panel: Danh Sách Sản Phẩm -->
        <div class="right-panel" *ngIf="!isEditMode">
          <div class="panel-header">
            <i class="bi bi-grid-3x3-gap"></i>
            <h4>Danh Sách Sản Phẩm</h4>
          </div>

          <!-- Search and Filter -->
          <div class="search-filter-section">
            <div class="search-group">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" placeholder="Tìm kiếm theo tên, mã..." [(ngModel)]="searchTerm"
                (keyup)="onSearch()" />
            </div>
            <div class="filter-group">
              <label>Hệ điều hành</label>
              <select class="form-control" [(ngModel)]="selectedOS" (change)="onOSChange()">
                <option value="">Tất cả</option>
                <option *ngFor="let os of operatingSystems" [value]="os">
                  {{ os }}
                </option>
              </select>
            </div>

            <div class="filter-group">
              <label>Nhà sản xuất</label>
              <select class="form-control" [(ngModel)]="selectedManufacturer" (change)="onManufacturerChange()">
                <option value="">Tất cả</option>
                <option *ngFor="let manufacturer of manufacturers" [value]="manufacturer">
                  {{ manufacturer }}
                </option>
              </select>
            </div>
          </div>

          <!-- Product Table -->
          <div class="table-container">
            <table class="product-table">
              <thead>
                <tr>
                  <th><input type="checkbox" [(ngModel)]="selectAll" (change)="onSelectAll()" /></th>
                  <th>STT</th>
                  <th>Mã</th>
                  <th>Tên SP</th>
                  <th>Hãng</th>
                  <th>Số lượng</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let product of filteredProducts; let i = index">
                  <td>
                    <input type="checkbox" [(ngModel)]="product.selected" (change)="onProductSelect(product)" />
                  </td>
                  <td>{{ i + 1 }}</td>
                  <td>{{ product.code }}</td>
                  <td>{{ product.name }}</td>
                  <td>{{ product.brand }}</td>
                  <td>{{ product.quantity }}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="pagination-section">
            <div class="pagination-info">
              <span>Hiển thị</span>
              <select class="form-control" [(ngModel)]="itemsPerPage" (change)="onItemsPerPageChange()">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
              </select>
              <span>mục/trang</span>
              <span class="current-range">Hiển thị {{ startItem }}-{{ endItem }}/{{ totalItems }} mục</span>
            </div>

            <div class="pagination-controls">
              <button class="btn btn-pagination" [disabled]="currentPage === 1" (click)="goToFirstPage()">
                <i class="bi bi-chevron-double-left"></i>
              </button>
              <button class="btn btn-pagination" [disabled]="currentPage === 1" (click)="goToPreviousPage()">
                <i class="bi bi-chevron-left"></i>
              </button>
              <button *ngFor="let page of visiblePages" class="btn btn-pagination" [class.active]="page === currentPage"
                (click)="goToPage(page)">
                {{ page }}
              </button>
              <button class="btn btn-pagination" [disabled]="currentPage === totalPages" (click)="goToNextPage()">
                <i class="bi bi-chevron-right"></i>
              </button>
              <button class="btn btn-pagination" [disabled]="currentPage === totalPages" (click)="goToLastPage()">
                <i class="bi bi-chevron-double-right"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Confirmation Modal -->
<div class="confirm-modal-overlay" *ngIf="showConfirmModal">
  <div class="confirm-modal">
    <div class="confirm-modal-header">
      <h3>Xác nhận</h3>
      <button class="btn-close" (click)="onCancelSave()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <div class="confirm-modal-body">
      <p>Bạn có muốn thêm mới đợt giảm giá này không?</p>
    </div>
    <div class="confirm-modal-footer">
      <button class="btn btn-secondary" (click)="onCancelSave()">Hủy</button>
      <button class="btn btn-primary" (click)="onConfirmSave()">Xác nhận</button>
    </div>
  </div>
</div>
