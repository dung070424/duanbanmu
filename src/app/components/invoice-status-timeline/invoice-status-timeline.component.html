<div class="invoice-status-timeline">
  <div class="timeline-header">
    <h6 class="timeline-title">Trạng Thái Đơn Hàng</h6>
  </div>
  
  <div class="timeline-container">
    <div class="timeline-steps">
      @for (step of statusSteps; track step.id) {
        <div class="timeline-step" [ngClass]="getStepClass(step)" (click)="onStepClick(step, $event)">
          <div class="step-label">{{ step.label }}</div>
          <div class="step-icon-wrapper">
            <div class="step-icon" [ngClass]="'icon-' + step.iconColor">
              <i [ngClass]="step.icon"></i>
            </div>
          </div>
          @if (step.actualTime) {
            <div class="step-time actual">{{ step.actualTime }}</div>
          }
          @if (step.estimatedTime && !step.actualTime) {
            <div class="step-time estimated">Dự kiến: {{ step.estimatedTime }}</div>
          }
        </div>
      }
    </div>
  </div>
</div>
