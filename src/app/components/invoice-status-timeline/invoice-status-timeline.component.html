<div class="invoice-status-timeline">
  <div class="timeline-header">
    <i class="fas fa-clock timeline-icon"></i>
    <h6 class="timeline-title">Trạng Thái Hóa Đơn</h6>
  </div>
  
  <div class="timeline-container">
    @if (currentStep) {
      <div class="current-status-display">
        <div class="status-icon-wrapper">
          <div class="step-circle" [ngClass]="getStepClass(currentStep)">
            <i [ngClass]="getStepIconClass(currentStep)"></i>
          </div>
        </div>
        <div class="step-content">
          <div class="step-label">{{ currentStep.label }}</div>
        </div>
      </div>
    } @else {
      <div class="no-status-message">
        <p>Chưa có trạng thái</p>
      </div>
    }
  </div>
</div>
