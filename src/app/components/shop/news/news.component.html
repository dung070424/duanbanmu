<div class="news-container">
  <app-shop-header></app-shop-header>

  <!-- News Content -->
  <main class="news-main">
    <!-- Hero Section -->
    <section class="hero-section">
      <div class="container">
        <div class="hero-content">
          <div class="hero-badge">
            <i class="fas fa-newspaper"></i>
            Tin tức & Blog
          </div>
          <h1 class="hero-title">Tin tức & Cập nhật</h1>
          <p class="hero-subtitle">
            Cập nhật những tin tức mới nhất về mũ bảo hiểm, an toàn giao thông, kinh nghiệm sử dụng và các sản phẩm mới từ TDK Store
          </p>
        </div>
      </div>
    </section>

    <div class="container">
      <!-- News Grid -->
      <section class="news-section">
        <div class="news-grid">
          <article *ngFor="let news of newsItems" class="news-card">
            <div class="news-image">
              <img
                [src]="news.imageUrl || 'https://img.websosanh.vn/v10/users/review/images/upwqa7ggsjfov/mu-bao-hiem-co-ket-cau-thoang-khi.jpg?compress=85'"
                [alt]="news.title"
                (error)="onImageError($event)"
              />
              <div class="news-category">{{ news.category }}</div>
            </div>
            <div class="news-content">
              <div class="news-meta">
                <span class="news-date"
                  ><i class="fas fa-calendar"></i> {{ formatDate(news.publishedAt) }}</span
                >
                <span class="news-category-badge">{{ news.category }}</span>
              </div>
              <h2 class="news-title">{{ news.title }}</h2>
              <p class="news-excerpt">{{ news.excerpt }}</p>
              <button class="news-read-more" type="button">
                Đọc thêm <i class="fas fa-arrow-right"></i>
              </button>
            </div>
          </article>
        </div>
      </section>
    </div>
  </main>

  <app-shop-footer></app-shop-footer>

  <!-- Chatbot Widget -->
  <app-chatbot></app-chatbot>
</div>
